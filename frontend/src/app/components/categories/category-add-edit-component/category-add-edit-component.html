<p-dialog
  [(visible)]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [closable]="!saving()"
  [header]="category ? 'Edit category' : 'Add category'"
  [style]="{ width: 'min(520px, calc(100vw - 2rem))' }"
>
  <form class="dialog-form" (ngSubmit)="save()">
    @if (formError()) {
      <p class="form-error"><i class="pi pi-exclamation-circle"></i>{{ formError() }}</p>
    }
    <div class="field">
      <label for="category-name">Name</label
      ><input
        pInputText
        id="category-name"
        name="name"
        [(ngModel)]="form.name"
        placeholder="Category name"
        [disabled]="saving()"
      />
    </div>
    <div class="field">
      <label for="category-description">Description</label
      ><textarea
        pTextarea
        id="category-description"
        name="description"
        [(ngModel)]="form.description"
        rows="4"
        placeholder="Optional description"
        [disabled]="saving()"
      ></textarea>
    </div>
    @if (category) {
      <div class="field">
        <label for="category-status">Status</label
        ><p-select
          inputId="category-status"
          name="is_active"
          [options]="statusOptions"
          [(ngModel)]="form.is_active"
          optionLabel="label"
          optionValue="value"
          [disabled]="saving()"
        />
      </div>
    }
    <div class="dialog-actions">
      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        [text]="true"
        (onClick)="close()"
        [disabled]="saving()"
      /><p-button
        type="submit"
        [label]="category ? 'Save changes' : 'Create category'"
        icon="pi pi-check"
        [loading]="saving()"
      />
    </div>
  </form>
</p-dialog>
