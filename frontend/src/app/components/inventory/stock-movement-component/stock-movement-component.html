<p-dialog
  [(visible)]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [closable]="!saving()"
  [header]="type === 'IN' ? 'Stock IN' : 'Stock OUT'"
  [style]="{ width: 'min(520px, calc(100vw - 2rem))' }"
  ><form class="dialog-form" (ngSubmit)="save()">
    @if (error()) {
      <p class="form-error"><i class="pi pi-exclamation-circle"></i>{{ error() }}</p>
    }
    <div class="selected-product">
      <span>Product</span><strong>{{ product?.name }}</strong
      ><small>{{ product?.code }}</small>
    </div>
    <div class="field">
      <label for="movement-quantity">Quantity</label
      ><p-inputnumber
        inputId="movement-quantity"
        name="quantity"
        [(ngModel)]="quantity"
        [min]="1"
        [showButtons]="true"
        [disabled]="saving()"
      />
    </div>
    <div class="field">
      <label for="movement-reason">Reason</label
      ><textarea
        pTextarea
        id="movement-reason"
        name="reason"
        [(ngModel)]="reason"
        rows="3"
        placeholder="Why is stock changing?"
        [disabled]="saving()"
      ></textarea>
    </div>
    <div class="field">
      <label for="movement-reference">Reference <span>(optional)</span></label
      ><input
        pInputText
        id="movement-reference"
        name="reference"
        [(ngModel)]="reference"
        placeholder="PO, invoice or ticket number"
        [disabled]="saving()"
      />
    </div>
    <div class="dialog-actions">
      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        [text]="true"
        (onClick)="close()"
        [disabled]="saving()"
      /><p-button
        type="submit"
        [label]="type === 'IN' ? 'Add stock' : 'Remove stock'"
        icon="pi pi-check"
        [severity]="type === 'IN' ? 'success' : 'danger'"
        [loading]="saving()"
      />
    </div></form
></p-dialog>
