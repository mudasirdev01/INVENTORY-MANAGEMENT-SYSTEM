<p-dialog
  [(visible)]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [closable]="!saving()"
  [header]="employee ? 'Edit employee' : 'Add employee'"
  styleClass="employee-dialog"
  [style]="{ width: 'min(620px, calc(100vw - 2rem))', height: 'min(560px, calc(100vh - 2rem))' }"
>
  <form id="employee-form" class="dialog-form" (ngSubmit)="save()">
    <div class="dialog-body">
      @if (formError()) {
        <p class="form-error"><i class="pi pi-exclamation-circle"></i>{{ formError() }}</p>
      }
      <div class="form-grid">
        <div class="field">
          <label for="employee-first-name">First name <span>*</span></label>
          <input
            pInputText
            id="employee-first-name"
            name="first_name"
            [(ngModel)]="form.first_name"
            [disabled]="saving()"
          />
        </div>
        <div class="field">
          <label for="employee-last-name">Last name <span>*</span></label>
          <input
            pInputText
            id="employee-last-name"
            name="last_name"
            [(ngModel)]="form.last_name"
            [disabled]="saving()"
          />
        </div>
      </div>
      <div class="field">
        <label for="employee-email">Email <span>*</span></label>
        <input
          pInputText
          type="email"
          id="employee-email"
          name="email"
          [(ngModel)]="form.email"
          [disabled]="saving()"
        />
      </div>
      @if (!employee) {
        <div class="field">
          <label for="employee-password">Temporary password <span>*</span></label>
          <p-password
            inputId="employee-password"
            name="password"
            [(ngModel)]="form.password"
            [feedback]="true"
            [toggleMask]="true"
            [disabled]="saving()"
            [fluid]="true"
          />
        </div>
      }
      <div class="form-grid">
        <div class="field">
          <label for="employee-role">Role <span>*</span></label>
          <p-select
            inputId="employee-role"
            name="role"
            [options]="roleOptions"
            [(ngModel)]="form.role"
            optionLabel="label"
            optionValue="value"
            appendTo="body"
            scrollHeight="140px"
            panelStyleClass="employee-select-panel"
            [disabled]="saving()"
          />
        </div>
        @if (employee) {
          <div class="field">
            <label for="employee-status">Status</label>
            <p-select
              inputId="employee-status"
              name="is_active"
              [options]="statusOptions"
              [(ngModel)]="form.is_active"
              optionLabel="label"
              optionValue="value"
              appendTo="body"
              scrollHeight="100px"
              panelStyleClass="employee-select-panel"
              [disabled]="saving()"
            />
          </div>
        }
      </div>
    </div>
  </form>
  <ng-template #footer>
    <div class="dialog-actions">
      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        [text]="true"
        (onClick)="close()"
        [disabled]="saving()"
      />
      <p-button
        type="button"
        [label]="employee ? 'Save changes' : 'Create employee'"
        icon="pi pi-check"
        [loading]="saving()"
        (onClick)="save()"
      />
    </div>
  </ng-template>
</p-dialog>
